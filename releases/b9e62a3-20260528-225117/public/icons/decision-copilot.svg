<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <!-- Branching decision paths -->
  <g stroke="white" stroke-width="28" stroke-linecap="round" fill="none" opacity="0.95">
    <!-- Main stem -->
    <line x1="256" y1="380" x2="256" y2="240"/>
    <!-- Left branch -->
    <line x1="256" y1="240" x2="156" y2="160"/>
    <!-- Right branch -->
    <line x1="256" y1="240" x2="356" y2="160"/>
    <!-- Left endpoint -->
    <circle cx="156" cy="140" r="24" fill="white" stroke="none" opacity="0.95"/>
    <!-- Right endpoint -->
    <circle cx="356" cy="140" r="24" fill="white" stroke="none" opacity="0.95"/>
    <!-- Center node -->
    <circle cx="256" cy="240" r="20" fill="white" stroke="none" opacity="0.95"/>
  </g>
</svg>
